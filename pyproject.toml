[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpi"
version = "1.1.0"
description = "MirrorLink-Pi: pretend a Raspberry Pi Zero is a MirrorLink phone for the car head unit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Robert Sirnicki" },
    { name = "Daniel Maksymilian" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[project.scripts]
mlpi = "mlpi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlpi = ["../config/*.tmpl", "../config/service-descriptors/*.xml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
